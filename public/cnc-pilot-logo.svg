<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
  <!-- Gear (outer) -->
  <g transform="translate(100, 85)">
    <!-- Gear teeth -->
    <path d="
      M-8,-52 L8,-52 L10,-42 L-10,-42 Z
      M-8,52 L8,52 L10,42 L-10,42 Z
      M-52,-8 L-52,8 L-42,10 L-42,-10 Z
      M52,-8 L52,8 L42,10 L42,-10 Z
      M-38,-38 L-30,-44 L-22,-36 L-30,-30 Z
      M38,-38 L30,-44 L22,-36 L30,-30 Z
      M-38,38 L-30,44 L-22,36 L-30,30 Z
      M38,38 L30,44 L22,36 L30,30 Z
    " fill="#7c3aed"/>
    <!-- Gear body -->
    <circle cx="0" cy="0" r="38" fill="#7c3aed"/>
    <!-- Inner cutout -->
    <circle cx="0" cy="0" r="24" fill="white"/>
    <!-- CNC crosshair / pilot reticle -->
    <line x1="-18" y1="0" x2="-6" y2="0" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="6" y1="0" x2="18" y2="0" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="-18" x2="0" y2="-6" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="6" x2="0" y2="18" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Center dot -->
    <circle cx="0" cy="0" r="2.5" fill="#7c3aed"/>
  </g>
  <!-- Text: CNC-Pilot -->
  <text x="100" y="168" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="#7c3aed" letter-spacing="1">CNC-Pilot</text>
  <!-- Subtext -->
  <text x="100" y="192" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400" fill="#6b7280" letter-spacing="2.5" text-transform="uppercase">PRODUCTION MANAGEMENT</text>
</svg>
